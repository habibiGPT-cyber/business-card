<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101316">
  <meta name="description" content="Digital business profile">
  <meta property="og:title" content="Business profile">
  <meta property="og:description" content="Connect with me digitally.">
  <title>Business profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="profile-card" aria-labelledby="name">
      <div class="hero">
        <div class="brand" aria-label="Rebtrade International Corporation">REBTRADE</div>
        <div class="portrait" id="portrait"><span class="avatar" id="avatar">AB</span></div>
        <div class="identity">
          <p class="role" id="role">Project Manager</p>
          <h1 id="name">Arnold Bolima</h1>
          <p class="company" id="companyLarge">Rebtrade International Corporation</p>
        </div>
      </div>
      <div class="body">
        <p class="tagline" id="tagline">Innovative products and services, built on experience, integrity, and excellent workmanship.</p>
        <div class="rule" aria-hidden="true"></div>
        <div class="links" id="links" aria-label="Contact details"></div>
        <div class="actions">
          <a class="primary" id="saveContact" download="arnold-bolima.vcf">＋ Add to Contacts</a>
          <button class="secondary" id="share" type="button">Share profile</button>
        </div>
      </div>
    </section>
  </main>
  <script src="profile.js"></script>
</body>
</html>
